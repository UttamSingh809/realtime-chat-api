version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realtime-chat-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api
      MONGODB_URI: mongodb://mongo:27017/realtime-chat
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: 'true'
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret_min_32_chars_aaaaaaaa}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret_min_32_chars_bbbbbb}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: '12'
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      UPLOAD_PROVIDER: local
      UPLOAD_DIR: uploads
      STATIC_UPLOADS_PREFIX: /static/uploads
      MAX_FILE_SIZE: '10485760'
      SWAGGER_ENABLED: 'true'
      LOG_LEVEL: info
      EMAIL_ENABLED: 'false'
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - chat-network

  mongo:
    image: mongo:7
    container_name: realtime-chat-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: realtime-chat
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - chat-network

  redis:
    image: redis:7-alpine
    container_name: realtime-chat-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chat-network

volumes:
  mongo-data:
  redis-data:

networks:
  chat-network:
    driver: bridge