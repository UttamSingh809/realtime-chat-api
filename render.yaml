services:
  - type: web
    name: realtime-chat-api
    env: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: npm ci --only=production
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: API_PREFIX
        value: /api
      - key: APP_NAME
        value: RealTime Chat API
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_ENABLED
        value: 'true'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: '12'
      - key: CORS_ORIGIN
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: UPLOAD_PROVIDER
        value: cloudinary
      - key: MAX_FILE_SIZE
        value: '10485760'
      - key: UPLOAD_DIR
        value: uploads
      - key: STATIC_UPLOADS_PREFIX
        value: /static/uploads
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: realtime-chat
      - key: EMAIL_ENABLED
        value: 'false'
      - key: LOG_LEVEL
        value: info
      - key: LOG_DIR
        value: logs
      - key: SWAGGER_ENABLED
        value: 'false'